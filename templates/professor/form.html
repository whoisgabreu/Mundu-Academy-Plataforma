{% extends "professor/base.html" %}

{% block professor_content %}
<div class="prof-page-head">
  <div>
    <span class="prof-eyebrow">Professor</span>
    <h1>{{ title }}</h1>
  </div>
  <a href="{{ cancel_url }}" class="prof-btn ghost"><i data-lucide="x"></i><span>Cancelar</span></a>
</div>

<form method="post" class="prof-form-card" {% if enctype %}enctype="multipart/form-data"{% endif %}>
  {{ csrf_input }}
  <div class="prof-form-grid">
    {% for field in form %}
    <label class="prof-field {% if field.field.widget.input_type == 'checkbox' %}check{% endif %}">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {% if field.errors %}<strong>{{ field.errors|join(', ') }}</strong>{% endif %}
    </label>
    {% endfor %}
  </div>
  {% if form.non_field_errors() %}
  <div class="prof-form-errors">{{ form.non_field_errors()|join(', ') }}</div>
  {% endif %}
  <div class="prof-form-actions">
    <a href="{{ cancel_url }}" class="prof-btn ghost">Voltar</a>
    <button type="submit" class="prof-btn primary"><i data-lucide="save"></i><span>Salvar</span></button>
  </div>
</form>
{% endblock %}
