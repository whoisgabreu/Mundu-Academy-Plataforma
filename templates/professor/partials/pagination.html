{% if page_obj.has_other_pages() %}
<nav class="prof-pagination" aria-label="Paginação">
  {% if page_obj.has_previous() %}
  <a href="?page={{ page_obj.previous_page_number() }}{% if q %}&q={{ q }}{% endif %}" class="prof-page-link">Anterior</a>
  {% endif %}
  <span class="prof-page-current">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next() %}
  <a href="?page={{ page_obj.next_page_number() }}{% if q %}&q={{ q }}{% endif %}" class="prof-page-link">Próxima</a>
  {% endif %}
</nav>
{% endif %}
