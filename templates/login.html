<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Mundu Academy</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      min-height: 100vh;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* ── CAMADAS DE FUNDO ── */

    /* 1. Grain/ruído — textura industrial */
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
    }

    /* 2. Círculo decorativo — elemento gráfico abstrato */
    .bg-circle {
      position: fixed;
      right: -15vw;
      bottom: -15vh;
      width: 55vw;
      max-width: 680px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid hsl(var(--primary) / 0.07);
      pointer-events: none;
      z-index: 0;
    }

    .bg-circle::before {
      content: '';
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid hsl(var(--primary) / 0.05);
    }

    .bg-circle::after {
      content: '';
      position: absolute;
      inset: 22%;
      border-radius: 50%;
      border: 1px solid hsl(var(--primary) / 0.04);
    }

    /* 3. Glow verde principal — topo */
    .bg-glow-top {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 700px;
      background: radial-gradient(ellipse at top, hsl(var(--primary) / 0.16) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* 4. Glow secundário — canto inferior esquerdo */
    .bg-glow-bottom {
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse at bottom left, hsl(var(--secondary) / 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* 5. Linhas diagonais sutis — textura industrial */
    .bg-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      background-image: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 40px,
        hsl(var(--foreground) / 0.012) 40px,
        hsl(var(--foreground) / 0.012) 41px
      );
    }

    /* ── WRAPPER ── */
    .login-wrapper {
      width: 100%;
      max-width: 448px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── LOGO ── */
    .login-logo {
      display: block;
      height: 160px;
      width: auto;
      margin-bottom: 14px;
      object-fit: contain;
      filter: brightness(1.15) drop-shadow(0 0 28px hsl(var(--primary) / 0.25));
    }

    /* Badge */
    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: hsl(var(--primary) / 0.1);
      border: 1px solid hsl(var(--primary) / 0.25);
      border-radius: 100px;
      padding: 5px 14px;
      margin-bottom: 32px;
    }

    .login-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: hsl(var(--primary));
      box-shadow: 0 0 8px hsl(var(--primary));
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px hsl(var(--primary)); }
      50% { opacity: 0.35; box-shadow: 0 0 2px hsl(var(--primary)); }
    }

    .login-badge-text {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: hsl(var(--primary));
    }

    /* ── CARD ── */
    .login-card {
      width: 100%;
      background: hsl(var(--card) / 0.92);
      border: 1px solid hsl(var(--border));
      border-radius: 20px;
      padding: 44px 40px 36px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px hsl(var(--primary) / 0.06),
        0 32px 80px -16px hsl(0 0% 0% / 0.7),
        inset 0 1px 0 hsl(var(--foreground) / 0.05);
    }

    /* Faixa verde topo */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gradient-primary);
    }

    /* Brilho interno */
    .login-card::after {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 120px;
      background: radial-gradient(ellipse, hsl(var(--primary) / 0.07), transparent 70%);
      pointer-events: none;
    }

    .login-heading {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.4px;
      color: hsl(var(--foreground));
      margin-bottom: 6px;
    }

    .login-subheading {
      font-size: 13px;
      font-weight: 400;
      color: hsl(var(--muted-foreground));
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── CAMPOS ── */
    .field-group { margin-bottom: 18px; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: hsl(var(--muted-foreground));
      margin-bottom: 8px;
    }

    .field-wrap { position: relative; }

    .field-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: hsl(var(--muted-foreground));
      pointer-events: none;
      transition: color 0.15s;
    }

    .field-wrap:focus-within .field-icon { color: hsl(var(--primary)); }

    .field-input {
      width: 100%;
      background: hsl(var(--background));
      border: 1.5px solid hsl(var(--border));
      color: hsl(var(--foreground));
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-input::placeholder {
      color: hsl(var(--muted-foreground) / 0.4);
      font-weight: 400;
    }

    .field-input:focus {
      border-color: hsl(var(--primary));
      box-shadow: 0 0 0 4px hsl(var(--primary) / 0.12);
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: hsl(var(--muted-foreground));
      padding: 4px;
      transition: color 0.15s;
      line-height: 0;
    }
    .toggle-password:hover { color: hsl(var(--foreground)); }

    /* ── BOTÃO ── */
    .btn-login {
      width: 100%;
      background: var(--gradient-primary);
      color: hsl(var(--primary-foreground));
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px hsl(var(--primary) / 0.4);
    }

    /* Shimmer no botão */
    .btn-login::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, hsl(0 0% 100% / 0.12), transparent);
      transition: left 0.5s ease;
    }

    .btn-login:hover::before { left: 150%; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 40px hsl(var(--primary) / 0.55); }
    .btn-login:active { transform: translateY(0); }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 24px;
      color: hsl(var(--muted-foreground));
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: hsl(var(--border));
    }

    /* ── FOOTER ── */
    .login-footer {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
    }
    .login-footer a {
      color: hsl(var(--primary));
      font-weight: 700;
      margin-left: 4px;
      transition: opacity 0.15s;
      text-decoration: none;
    }
    .login-footer a:hover { opacity: 0.75; }

    /* ── ERRO ── */
    .error-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: hsl(var(--destructive) / 0.08);
      border: 1px solid hsl(var(--destructive) / 0.3);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--destructive));
      line-height: 1.4;
    }
    .error-box svg { flex-shrink: 0; margin-top: 1px; }

    .page-footer {
      margin-top: 24px;
      font-size: 11px;
      font-weight: 500;
      color: hsl(var(--muted-foreground) / 0.4);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Camadas de fundo -->
  <div class="bg-noise"></div>
  <div class="bg-lines"></div>
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>
  <div class="bg-circle"></div>

  <div class="login-wrapper">

    <!-- Logo -->
    <img
      src="{{ url_for('static', filename='img/mundu-logo-horizontal.png') }}"
      alt="MUNDU Academy"
      class="login-logo"
    >

    <!-- Badge -->
    <div class="login-badge">
      <span class="login-badge-dot"></span>
      <span class="login-badge-text">Plataforma de alta performance</span>
    </div>

    <!-- Card -->
    <div class="login-card">

      <h1 class="login-heading">Bem-vindo de volta</h1>
      <p class="login-subheading">Entre na sua conta e continue evoluindo</p>

      {% if error %}
      <div class="error-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login">
        {{ csrf_input }}

        <!-- Usuário -->
        <div class="field-group">
          <label class="field-label" for="username">Usuário</label>
          <div class="field-wrap">
            <input class="field-input" id="username" type="text" name="username" required autocomplete="username" placeholder="seu_usuario" autofocus>
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>

        <!-- Senha -->
        <div class="field-group">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <label class="field-label" for="password" style="margin-bottom:0;">Senha</label>
            <a href="#" style="font-size:11px; font-weight:600; color:hsl(var(--primary)); opacity:0.75; text-decoration:none; transition:opacity 0.15s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.75'">Esqueci a senha</a>
          </div>
          <div class="field-wrap">
            <input class="field-input" id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••" style="padding-right:44px;">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1">
              <svg id="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Botão -->
        <button class="btn-login" type="submit">
          Entrar na plataforma
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <div class="divider">ou</div>

      <p class="login-footer">
        Ainda não tem conta?
        <a href="/registro">Criar conta grátis</a>
      </p>
    </div>

    <p class="page-footer">© 2025 Mundu Academy · Todos os direitos reservados</p>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const show = document.getElementById('eye-show');
      const hide = document.getElementById('eye-hide');
      if (input.type === 'password') {
        input.type = 'text';
        show.style.display = 'none';
        hide.style.display = 'block';
      } else {
        input.type = 'password';
        show.style.display = 'block';
        hide.style.display = 'none';
      }
    }
  </script>

</body>
</html>
